name: Build Windows 10 & 11 ISO

run-name: >
  ${{ inputs.versions }}
  ${{ fromJSON('{"Pro":"PRO","Home":"HOME","Multi":"MULTI","Enterprise":"ENTERPRISE","EnterpriseS":"ENTERPRISE_S"}')[inputs.edition] }}
  ${{ fromJSON('{"x64":"X64","arm64":"ARM64"}')[inputs.architecture] }}
  ${{ fromJSON('{"English (United States)":"EN","Chinese (Simplified, China)":"ZH"}')[inputs.language] }}
  ${{ inputs.esd && 'ESD' || '' }}
  ${{ inputs.drivers && 'DRIVERS' || '' }}
  ${{ inputs.netfx3 && 'NETFX3' || '' }}

on:
  schedule:
    - cron: '0 2 1 * *' # 每月1号自动定时构建
  workflow_dispatch:
    inputs:
      architecture:
        description: "Windows architecture to build"
        type: choice
        options: [x64, arm64]
        default: x64
        required: true
      versions:
        description: "Windows version to build"
        type: choice
        options:
          - Windows 10 22H2
          - Windows 10 21H2 (LTSC)
          - Windows 10 1809 (LTSC / LTSB)
          - Windows 10 1607 (LTSB)
          - Windows 11 23H2
          - Windows 11 24H2
          - Windows 11 LTSC 2024
          - Windows 11 25H2
        default: Windows 11 24H2
        required: true
      edition:
        description: "Windows edition to build"
        type: choice
        options: [Pro, Home, Multi, Enterprise, EnterpriseS]
        default: Multi
        required: true
      language:
        description: "Language"
        type: choice
        options:
          - English (United States)
          - Chinese (Simplified, China)
        default: Chinese (Simplified, China)
        required: true
      revision:
        description: "Revision number (optional)"
        type: string
        required: false
      esd:
        description: "Use ESD compression"
        type: boolean
        required: true
        default: true
      netfx3:
        description: "Add .NET Framework 3.5"
        type: boolean
        required: true
        default: true
      drivers:
        description: "Add additional drivers (only for x64)"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ fromJSON('{"x64":"windows-2025","arm64":"windows-11-arm"}')[inputs.architecture] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Map inputs
        id: map
        shell: pwsh
        run: |
          $langMap = @{
            'English (United States)'='en-us'
            'Chinese (Simplified, China)'='zh-cn'
          }

          $verMap = @{
            'Windows 10 22H2'             = 'windows-10'
            'Windows 10 21H2 (LTSC)'      = 'windows-10-ltsc-21h2'
            'Windows 10 1809 (LTSC / LTSB)' = 'windows-10-ltsc-1809'
            'Windows 10 1607 (LTSB)'      = 'windows-10-ltsb-1607'
            'Windows 11 23H2'             = 'windows-11old'
            'Windows 11 24H2'             = 'windows-11'
            'Windows 11 LTSC 2024'        = 'windows-11'
            'Windows 11 25H2'             = 'windows-11new'
          }

          $langCode = $langMap['${{ inputs.language }}']
          $verCode  = $verMap['${{ inputs.versions }}']

          $opts = ''
          if ('${{ inputs.esd }}' -eq 'true')     { $opts += ' -esd' }
          # 驱动选项仅在 x64 架构下生效
          if (('${{ inputs.drivers }}' -eq 'true') -and ('${{ inputs.architecture }}' -ne 'arm64')) {
            $opts += ' -drivers'
          }
          if ('${{ inputs.netfx3 }}' -eq 'true')  { $opts += ' -netfx3' }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.revision }}')) {
            $opts += ' -revision "${{ inputs.revision }}"'
          }
          $opts = $opts.Trim()

          echo "lang=$langCode"    >> $env:GITHUB_OUTPUT
          echo "version=$verCode"  >> $env:GITHUB_OUTPUT
          if ($opts) {
            echo "options=$opts"   >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows
        id: build_windows
        shell: pwsh
        run: |
          pwsh uup-dump-get-windows-iso.ps1 ${{ steps.map.outputs.version }} ${{ inputs.architecture == 'arm64' && 'c:/output' || 'd:/output' }} -architecture ${{ inputs.architecture }} -edition ${{ inputs.edition }} -lang ${{ steps.map.outputs.lang }} ${{ steps.map.outputs.options }}
          echo "iso_name=$env:ISO_NAME" >> $env:GITHUB_ENV

      - name: Create split zip
        shell: pwsh
        run: |
          7z a -tzip -mx=0 -v1950M -bsp2 "${{ inputs.architecture == 'arm64' && 'c:/output' || 'd:/output' }}/$($env:ISO_NAME).zip" "$((Get-Item -Path '${{ inputs.architecture == 'arm64' && 'C:/output' || 'D:/output' }}/*.ISO').FullName)"

      - name: Upload ISO artifact
        id: upload_iso_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: ${{ inputs.architecture == 'arm64' && 'c:/output/*.ISO' || 'd:/output/*.ISO' }}
          if-no-files-found: error

      - name: Build summary
        id: build_summary
        shell: pwsh
        run: |
          $iso = Get-Content (Resolve-Path '${{ inputs.architecture == 'arm64' && 'c:/output' || 'd:/output' }}/*.json') | ConvertFrom-Json
          $finalImageName = $iso.images | ForEach-Object { $_.name } -join '/'

          echo "build=$($iso.build)" >> $env:GITHUB_ENV
          echo "version=$($iso.version)" >> $env:GITHUB_ENV
          echo "tagname=$($iso.build).$($iso.version).${{ inputs.edition }}.${{ inputs.architecture }}.${{ steps.map.outputs.lang }}" >> $env:GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.tagname }}"
          name: "${{ env.images }} ${{ inputs.architecture }} ${{ env.version }}"
          files: |
            ${{ inputs.architecture == 'arm64' && 'C:/output/*.zip.0*' || 'D:/output/*.zip.0*' }}