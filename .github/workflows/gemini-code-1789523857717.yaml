name: Build All Windows Server Matrix (X64, ZH-CN)

on:
  schedule:
    - cron: '30 2 1 * *' # 每月1号自动定时构建
  workflow_dispatch: # 一键手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: Windows Server 2025
            code: windows-server-2025
          - name: Windows Server 2022
            code: windows-server-2022
          - name: Windows Server 2019
            code: windows-server-2019

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Windows Server ISO
        id: build_server
        shell: pwsh
        run: |
          $opts = "-esd -drivers"
          Write-Host "Building Server: ${{ matrix.version.name }} | x64 | zh-cn"
          pwsh uup-dump-get-windows-iso.ps1 ${{ matrix.version.code }} d:/output -architecture x64 -edition multi -lang zh-cn $opts
          echo "iso_name=$env:ISO_NAME" >> $env:GITHUB_ENV

      - name: Create split zip
        shell: pwsh
        run: |
          7z a -tzip -mx=0 -v1950M -bsp2 "d:/output/$($env:ISO_NAME).zip" "$((Get-Item -Path 'd:/output/*.ISO').FullName)"

      - name: Build summary & tag
        id: summary
        shell: pwsh
        run: |
          $iso = Get-Content (Resolve-Path 'd:/output/*.json') | ConvertFrom-Json
          echo "build=$($iso.build)" >> $env:GITHUB_ENV
          echo "version=$($iso.version)" >> $env:GITHUB_ENV
          echo "tagname=server.${{ matrix.version.code }}.$($iso.build).multi.x64.zh-cn" >> $env:GITHUB_ENV

      - name: Delete old release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = "${{ env.tagname }}"
          $repo = "${{ github.repository }}"
          
          gh release delete $tagName --repo $repo --yes 2>$null
          git push origin --delete $tagName 2>$null
          Write-Host "Old release (if any) cleaned up."

      - name: Create Release & Upload with Fast Download Links
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ env.tagname }}"
          name: "Windows Server ${{ matrix.version.name }} MULTI X64 简体中文 (${{ env.version }})"
          body: |
            ### 📥 下载加速说明
            中国大陆地区下载较慢？请复制下方直链，在前面加上代理或使用加速服务：
            - 加速前缀：`https://gh-proxy.com/`
            - 示例：`https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/${{ env.tagname }}/文件名.zip.01`
            
            ### 📦 文件列表
          files: |
            d:/output/*.zip.0*